<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🙏 佛祖保佑 李欣悦及其室友 逢考必过 🙏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'STKaiti', '楷体', serif;
            background: linear-gradient(45deg, #1a0033, #330066, #4d0080, #6600cc);
            background-size: 400% 400%;
            animation: gradientShift 8s ease-in-out infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 粒子效果背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: gold;
            border-radius: 50%;
            animation: float 6s linear infinite;
            opacity: 0.7;
            box-shadow: 0 0 10px gold;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 光环效果 */
        .halo {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 3px solid transparent;
            border-radius: 50%;
            background: linear-gradient(45deg, gold, orange, gold, orange);
            background-clip: padding-box;
            animation: rotate 20s linear infinite;
            opacity: 0.3;
        }

        .halo::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, gold, orange, gold, orange);
            border-radius: 50%;
            z-index: -1;
            filter: blur(10px);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 主标题 */
        .main-title {
            font-size: 4rem;
            font-weight: bold;
            color: gold;
            text-shadow: 
                0 0 20px gold,
                0 0 40px gold,
                0 0 60px orange,
                0 0 80px orange;
            margin-bottom: 2rem;
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 0.5rem;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 20px gold,
                    0 0 40px gold,
                    0 0 60px orange,
                    0 0 80px orange;
            }
            to {
                text-shadow: 
                    0 0 30px gold,
                    0 0 60px gold,
                    0 0 90px orange,
                    0 0 120px orange;
            }
        }

        /* 副标题 */
        .subtitle {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 个人专属祝福 */
        .personal-blessing {
            margin: 2rem 0;
            animation: fadeInUp 1s ease-out;
            animation-delay: 0.3s;
        }

        .name-blessing {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff69b4;
            text-shadow: 
                0 0 20px #ff69b4,
                0 0 40px #ff1493,
                0 0 60px #ff1493;
            margin: 1.5rem 0;
            animation: rainbow-glow 3s ease-in-out infinite;
            letter-spacing: 0.3rem;
            background: linear-gradient(45deg, #ff69b4, #ffd700, #ff69b4, #ffd700);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes rainbow-glow {
            0%, 100% {
                background-position: 0% 50%;
                text-shadow: 
                    0 0 20px #ff69b4,
                    0 0 40px #ff1493,
                    0 0 60px #ff1493;
            }
            50% {
                background-position: 100% 50%;
                text-shadow: 
                    0 0 30px #ffd700,
                    0 0 50px #ffb347,
                    0 0 70px #ffb347;
            }
        }

        /* 祝福语 */
        .blessing {
            font-size: 1.4rem;
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
            margin: 1rem 0;
            animation: fadeInUp 1s ease-out;
            opacity: 0.9;
        }

        .blessing:nth-child(1) { animation-delay: 0.8s; }
        .blessing:nth-child(2) { animation-delay: 1.2s; }
        .blessing:nth-child(3) { animation-delay: 1.6s; }
        .blessing:nth-child(4) { animation-delay: 2s; }

        /* 莲花装饰 */
        .lotus {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: lotus-pulse 3s ease-in-out infinite;
            opacity: 0.6;
        }

        .lotus-1 {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .lotus-2 {
            top: 60%;
            right: 15%;
            animation-delay: 1s;
        }

        .lotus-3 {
            bottom: 20%;
            left: 20%;
            animation-delay: 2s;
        }

        @keyframes lotus-pulse {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.2) rotate(180deg);
                opacity: 0.8;
            }
        }

        /* 佛教经文 */
        .sutra {
            margin-top: 3rem;
            animation: fadeInUp 1s ease-out;
            animation-delay: 2.5s;
        }

        .sutra-text {
            font-size: 1rem;
            color: #e0e0e0;
            text-shadow: 0 0 10px rgba(224, 224, 224, 0.6);
            opacity: 0.8;
            letter-spacing: 0.2rem;
            line-height: 1.6;
            font-style: italic;
        }

        /* 佛珠装饰 */
        .prayer-beads {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            animation: fadeInUp 1s ease-out;
            animation-delay: 3s;
        }

        .bead {
            width: 15px;
            height: 15px;
            background: linear-gradient(45deg, #8B4513, #CD853F);
            border-radius: 50%;
            box-shadow: 
                0 0 10px rgba(139, 69, 19, 0.8),
                inset 2px 2px 4px rgba(205, 133, 63, 0.3);
            animation: bead-glow 4s ease-in-out infinite;
        }

        .bead:nth-child(1) { animation-delay: 0s; }
        .bead:nth-child(2) { animation-delay: 0.8s; }
        .bead:nth-child(3) { animation-delay: 1.6s; }
        .bead:nth-child(4) { animation-delay: 2.4s; }
        .bead:nth-child(5) { animation-delay: 3.2s; }

        @keyframes bead-glow {
            0%, 100% {
                box-shadow: 
                    0 0 10px rgba(139, 69, 19, 0.8),
                    inset 2px 2px 4px rgba(205, 133, 63, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 20px rgba(255, 215, 0, 0.9),
                    inset 2px 2px 4px rgba(255, 215, 0, 0.5);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
                letter-spacing: 0.2rem;
            }
            
            .subtitle {
                font-size: 1.3rem;
            }
            
            .blessing {
                font-size: 1.1rem;
            }
            
            .name-blessing {
                font-size: 1.8rem;
                letter-spacing: 0.1rem;
            }
            
            .halo {
                width: 400px;
                height: 400px;
            }
            
            .sutra-text {
                font-size: 0.9rem;
                letter-spacing: 0.1rem;
            }
            
            .prayer-beads {
                gap: 15px;
            }
            
            .bead {
                width: 12px;
                height: 12px;
            }
        }

        /* 闪烁星星效果 */
        .star {
            position: absolute;
            background: white;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 粒子效果 -->
    <div class="particles" id="particles"></div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 光环效果 -->
        <div class="halo"></div>
        
        <!-- 莲花装饰 -->
        <div class="lotus lotus-1"></div>
        <div class="lotus lotus-2"></div>
        <div class="lotus lotus-3"></div>
        
        <!-- 主要内容 -->
        <h1 class="main-title">佛祖保佑逢考必过</h1>
        <p class="subtitle">🙏 南无阿弥陀佛 🙏</p>
        
        <!-- 个人专属祝福 -->
        <div class="personal-blessing">
            <p class="name-blessing">🌸 祝愿 李欣悦 及其室友  🌸</p>
        </div>
        
        <div class="blessings">
            <p class="blessing">📚 智慧如海，学业有成</p>
            <p class="blessing">✨ 心如明镜，思路清晰</p>
            <p class="blessing">🎯 金榜题名，前程似锦</p>
            <p class="blessing">🏆 考试顺利，梦想成真</p>
        </div>
        
        <!-- 佛教经文 -->
        <div class="sutra">
            <p class="sutra-text">观自在菩萨 行深般若波罗蜜多时 照见五蕴皆空 度一切苦厄</p>
        </div>
        
        <!-- 佛珠装饰 -->
        <div class="prayer-beads">
            <div class="bead"></div>
            <div class="bead"></div>
            <div class="bead"></div>
            <div class="bead"></div>
            <div class="bead"></div>
        </div>
    </div>

    <script>
        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // 创建闪烁星星
        function createStars() {
            const starCount = 30;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(star);
            }
        }

        // 页面加载完成后初始化效果
        window.addEventListener('load', function() {
            createParticles();
            createStars();
        });

        // 点击页面时创建涟漪效果和祈愿提示
        let clickCount = 0;
        const blessings = [
            "🙏 祈愿已收到！",
            "✨ 佛祖庇佑！",
            "🌸 好运加持！",
            "📚 智慧增长！",
            "🎯 考试必胜！"
        ];

        document.addEventListener('click', function(e) {
            // 涟漪效果
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.background = 'rgba(255, 215, 0, 0.6)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'ripple 1s ease-out forwards';
            document.body.appendChild(ripple);
            
            // 祈愿提示
            const blessing = document.createElement('div');
            blessing.textContent = blessings[clickCount % blessings.length];
            blessing.style.position = 'absolute';
            blessing.style.left = e.clientX + 'px';
            blessing.style.top = (e.clientY - 40) + 'px';
            blessing.style.color = '#ffd700';
            blessing.style.fontSize = '1.2rem';
            blessing.style.fontWeight = 'bold';
            blessing.style.textShadow = '0 0 10px gold';
            blessing.style.transform = 'translate(-50%, -50%)';
            blessing.style.pointerEvents = 'none';
            blessing.style.animation = 'floatUp 2s ease-out forwards';
            blessing.style.zIndex = '1000';
            document.body.appendChild(blessing);
            
            clickCount++;
            
            setTimeout(() => {
                ripple.remove();
                blessing.remove();
            }, 2000);
        });

        // 添加涟漪和浮起动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: translate(-50%, -50%) scale(20);
                    opacity: 0;
                }
            }
            @keyframes floatUp {
                0% {
                    opacity: 1;
                    transform: translate(-50%, -50%) translateY(0);
                }
                100% {
                    opacity: 0;
                    transform: translate(-50%, -50%) translateY(-60px);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
